<!DOCTYPE html>
<html lang="hu">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>MapMaker - Képtérkép szerkesztő</title>

<style>
*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

body{
    font-family:'Segoe UI',Tahoma,Geneva,Verdana,sans-serif;
    background:#0d0d12;
    color:#e0e0ff;
    height:100vh;
    overflow:hidden;
}

.app-container{
    display:flex;
    width:100%;
    height:100vh;
}

/* BAL */

.image-list{
    width:320px;
    min-width:320px;
    background:#12121a;
    border-right:2px solid #1f1f2e;
    display:flex;
    flex-direction:column;
    padding:15px;
}

.image-list h3{
    margin-bottom:12px;
    text-align:center;
    color:#a0a0ff;
}

.upload-area{
    margin-bottom:15px;
    background:#1a1a24;
    padding:12px;
    border-radius:8px;
    text-align:center;
}

.upload-btn{
    background:#5b4fff;
    border:none;
    color:white;
    padding:10px 24px;
    border-radius:6px;
    cursor:pointer;
    font-weight:bold;
    margin:4px;
}

.thumbnail-container{
    display:flex;
    flex-wrap:wrap;
    gap:10px;
    overflow-y:auto;
    flex:1;
}

.image-item{
    width:100px;
    background:#1a1a24;
    border-radius:10px;
    padding:6px;
    text-align:center;
    cursor:pointer;
    border:2px solid #25253a;
    transition:0.15s;
}

.image-item:hover{
    border-color:#5b4fff;
}

.image-item.selected{
    border-color:#a0a0ff;
    box-shadow:0 0 12px rgba(160,160,255,0.5);
    transform:scale(1.05);
}

.image-item img{
    width:88px;
    height:88px;
    object-fit:cover;
    border-radius:6px;
}

/* JOBB */

.map-area{
    flex:1;
    display:flex;
    flex-direction:column;
    padding:15px;
    background:#0a0a10;
    overflow:hidden;
}

.toolbar{
    display:flex;
    gap:12px;
    margin-bottom:12px;
    flex-wrap:wrap;
    align-items:center;
}

.grid-settings{
    display:flex;
    gap:8px;
    align-items:center;
    background:#1a1a24;
    padding:8px 12px;
    border-radius:6px;
}

.grid-settings input{
    width:70px;
    background:#25253a;
    color:#eee;
    border:none;
    padding:5px;
}

button{
    border:none;
    cursor:pointer;
}

.export-btn,
#importBtn,
#resizeBtn{
    background:#3b2f8f;
    color:white;
    padding:10px 20px;
    border-radius:6px;
    font-weight:bold;
}

.export-btn:hover,
#importBtn:hover,
#resizeBtn:hover{
    background:#4c3fb8;
}

.grid-container{
    flex:1;
    overflow:auto;
    background:#111;
    border-radius:10px;
    border:1px solid #222;
    padding:20px;
    cursor:crosshair;
}

.grid{
    display:grid;
    gap:1px;
    width:max-content;
    height:max-content;
}

.grid-cell{
    width:50px;
    height:50px;
    background:#1b1b24;
    border:1px solid #2a2a38;
    overflow:hidden;
    position:relative;
    user-select:none;
}

.grid-cell:hover{
    border-color:#5b4fff;
}

.grid-cell img.main-img{
    width:100%;
    height:100%;
    object-fit:cover;
}

.cell-label{
    position:absolute;
    bottom:2px;
    right:3px;
    font-size:9px;
    background:rgba(0,0,0,0.9);
    color:#a0a0ff;
    padding:1px 4px;
    font-family:monospace;
    z-index:2;
}

.info{
    margin-top:12px;
    font-size:11px;
    color:#777799;
    text-align:center;
}

.json-preview{
    margin-top:10px;
    background:#0f0f17;
    padding:10px;
    font-family:monospace;
    font-size:11px;
    max-height:110px;
    overflow:auto;
    border:1px solid #1f1f2e;
}
</style>
</head>

<body>

<div class="app-container">

    <div class="image-list">

        <h3>📸 Képtár</h3>

        <div class="upload-area">

            <input type="file"
                   id="fileInput"
                   multiple
                   accept="image/*"
                   style="display:none;">

            <input type="file"
                   id="jsonInput"
                   accept=".json"
                   style="display:none;">

            <button class="upload-btn"
                    id="uploadBtn">
                ➕ Képek
            </button>

            <button class="upload-btn"
                    id="importBtn">
                📂 MAP BETÖLTÉS
            </button>

        </div>

        <div class="thumbnail-container"
             id="thumbnailContainer"></div>

    </div>

    <div class="map-area">

        <div class="toolbar">

            <div class="grid-settings">

                <label>Oszlopok:</label>

                <input type="number"
                       id="colsInput"
                       value="50">

                <label>Sorok:</label>

                <input type="number"
                       id="rowsInput"
                       value="30">

                <button id="resizeBtn">
                    Átméretezés
                </button>

            </div>

            <button class="export-btn"
                    id="exportBtn">
                📥 EXPORT
            </button>

        </div>

        <div class="grid-container"
             id="gridContainer">

            <div class="grid"
                 id="mapGrid"></div>

        </div>

        <div class="info">
            💡 Tartsd lenyomva az egeret és húzz a festéshez
        </div>

        <div class="json-preview"
             id="jsonPreview"></div>

    </div>

</div>

<script>
let images = [];

let gridCols = 50;
let gridRows = 30;

let gridData =
    Array(gridRows * gridCols).fill(0);

let selectedValue = null;
let isPainting = false;

const CELL_SIZE = 51;

const thumbnailContainer =
    document.getElementById('thumbnailContainer');

const mapGrid =
    document.getElementById('mapGrid');

const gridContainer =
    document.getElementById('gridContainer');

const exportBtn =
    document.getElementById('exportBtn');

const importBtn =
    document.getElementById('importBtn');

const resizeBtn =
    document.getElementById('resizeBtn');

const colsInput =
    document.getElementById('colsInput');

const rowsInput =
    document.getElementById('rowsInput');

const jsonPreview =
    document.getElementById('jsonPreview');

const fileInput =
    document.getElementById('fileInput');

const jsonInput =
    document.getElementById('jsonInput');

const uploadBtn =
    document.getElementById('uploadBtn');

function extractNumberFromFilename(filename){

    const match =
        filename.match(/(\d+)/);

    return match
        ? parseInt(match[1],10)
        : 0;
}

function renderImageList(){

    thumbnailContainer.innerHTML = '';

    images.forEach(img=>{

        const div =
            document.createElement('div');

        div.className =
            `image-item ${
                selectedValue === img.numericValue
                ? 'selected'
                : ''
            }`;

        div.innerHTML = `
            <img src="${img.url}">
            <div>${img.numericValue}</div>
        `;

        div.addEventListener('click',()=>{

            selectedValue =
                selectedValue === img.numericValue
                ? null
                : img.numericValue;

            renderImageList();
        });

        thumbnailContainer.appendChild(div);
    });
}

function updateCell(index, existingCell = null){

    const cell =
        existingCell ||
        mapGrid.querySelector(
            `[data-index="${index}"]`
        );

    if(!cell) return;

    cell.innerHTML = '';

    const value = gridData[index];

    if(value !== 0){

        const imgObj =
            images.find(
                img => img.numericValue === value
            );

        if(imgObj){

            const img =
                document.createElement('img');

            img.src = imgObj.url;

            img.className = 'main-img';

            cell.appendChild(img);

            const label =
                document.createElement('div');

            label.className = 'cell-label';

            label.textContent = value;

            cell.appendChild(label);
        }
    }
}

function createCell(index){

    const cell =
        document.createElement('div');

    cell.className = 'grid-cell';

    cell.dataset.index = index;

    updateCell(index, cell);

    cell.addEventListener('mousedown',e=>{

        e.preventDefault();

        isPainting = true;

        if(selectedValue !== null){
            paintCell(index);
        }
    });

    cell.addEventListener('mouseenter',()=>{

        if(
            isPainting &&
            selectedValue !== null
        ){
            paintCell(index);
        }
    });

    return cell;
}

function renderGrid(){

    mapGrid.innerHTML = '';

    mapGrid.style.gridTemplateColumns =
        `repeat(${gridCols},50px)`;

    for(
        let i = 0;
        i < gridRows * gridCols;
        i++
    ){

        mapGrid.appendChild(
            createCell(i)
        );
    }
}

function paintCell(index){

    if(index < 0) return;

    if(selectedValue === null) return;

    if(gridData[index] === selectedValue){
        return;
    }

    gridData[index] = selectedValue;

    updateCell(index);

    updatePreview();
}

function getCellFromMouse(e){

    const rect =
        mapGrid.getBoundingClientRect();

    const scrollLeft =
        gridContainer.scrollLeft;

    const scrollTop =
        gridContainer.scrollTop;

    const x =
        e.clientX -
        rect.left +
        scrollLeft;

    const y =
        e.clientY -
        rect.top +
        scrollTop;

    const col =
        Math.floor(x / CELL_SIZE);

    const row =
        Math.floor(y / CELL_SIZE);

    if(
        col < 0 ||
        row < 0 ||
        col >= gridCols ||
        row >= gridRows
    ){
        return -1;
    }

    return row * gridCols + col;
}

function handleMouseMove(e){

    if(!isPainting) return;

    if(selectedValue === null) return;

    const index =
        getCellFromMouse(e);

    if(index !== -1){
        paintCell(index);
    }
}

function resizeGrid(){

    const newCols =
        parseInt(colsInput.value) || 50;

    const newRows =
        parseInt(rowsInput.value) || 30;

    const newData =
        Array(newCols * newRows).fill(0);

    for(
        let r = 0;
        r < Math.min(gridRows,newRows);
        r++
    ){

        for(
            let c = 0;
            c < Math.min(gridCols,newCols);
            c++
        ){

            newData[r * newCols + c] =
                gridData[r * gridCols + c];
        }
    }

    gridCols = newCols;
    gridRows = newRows;

    gridData = newData;

    renderGrid();

    updatePreview();
}

function get2DArray(){

    const arr = [];

    for(let r=0;r<gridRows;r++){

        const row = [];

        for(let c=0;c<gridCols;c++){

            row.push(
                gridData[
                    r * gridCols + c
                ]
            );
        }

        arr.push(row);
    }

    return arr;
}

function updatePreview(){

    const json =
        JSON.stringify(
            get2DArray(),
            null,
            2
        );

    jsonPreview.textContent =
        json.length > 500
        ? json.substring(0,500) + "\n..."
        : json;
}

function exportMap(){

    const data = {
        cols:gridCols,
        rows:gridRows,
        grid:get2DArray()
    };

    const jsonStr =
        JSON.stringify(data,null,2);

    const blob =
        new Blob(
            [jsonStr],
            {type:'application/json'}
        );

    const url =
        URL.createObjectURL(blob);

    const a =
        document.createElement('a');

    a.href = url;

    a.download = 'map.json';

    a.click();

    URL.revokeObjectURL(url);

    // NEM törlünk semmit export után
}

function importMap(file){

    const reader = new FileReader();

    reader.onload = e => {

        try{

            const data =
                JSON.parse(e.target.result);

            gridCols = data.cols;
            gridRows = data.rows;

            colsInput.value = gridCols;
            rowsInput.value = gridRows;

            gridData = [];

            for(let r=0;r<data.rows;r++){

                for(let c=0;c<data.cols;c++){

                    gridData.push(
                        data.grid[r][c]
                    );
                }
            }

            renderGrid();

            updatePreview();

            alert('Map sikeresen betöltve!');

        }catch(err){

            alert('Hibás map fájl!');
        }
    };

    reader.readAsText(file);
}

function addImage(file){

    if(!file.type.startsWith('image/')){
        return;
    }

    const numericValue =
        extractNumberFromFilename(file.name);

    const reader = new FileReader();

    reader.onload = e => {

        images.push({
            name:file.name,
            url:e.target.result,
            numericValue
        });

        renderImageList();

        renderGrid();
    };

    reader.readAsDataURL(file);
}

uploadBtn.addEventListener(
    'click',
    ()=>fileInput.click()
);

importBtn.addEventListener(
    'click',
    ()=>jsonInput.click()
);

fileInput.addEventListener(
    'change',
    e => {

        Array.from(e.target.files)
            .forEach(addImage);
    }
);

jsonInput.addEventListener(
    'change',
    e => {

        if(e.target.files[0]){
            importMap(e.target.files[0]);
        }
    }
);

resizeBtn.addEventListener(
    'click',
    resizeGrid
);

exportBtn.addEventListener(
    'click',
    exportMap
);

document.addEventListener(
    'mousemove',
    handleMouseMove
);

document.addEventListener(
    'mouseup',
    ()=>{
        isPainting = false;
    }
);

document.addEventListener(
    'mouseleave',
    ()=>{
        isPainting = false;
    }
);

colsInput.value = gridCols;
rowsInput.value = gridRows;

renderGrid();

updatePreview();
</script>

</body>
</html>
